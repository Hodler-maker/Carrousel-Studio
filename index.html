<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carrousel Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f5efe4;
    --orange:#ff7a2f;
    --orange-deep:#ff5a1f;
    --amber:#ffb547;
    --ink:#19140d;
    --text-dim:#7c7060;
    --font-body:'Inter', sans-serif;
    --font-mono:'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    min-height:100vh;
    overflow:hidden;
    position:relative;
  }

  .stage{
    position:relative;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    overflow:hidden;
  }
  .stage.is-shaking{ animation:stageShake .4s ease-in-out 3; }

  .orb{position:absolute; border-radius:50%; filter:blur(90px); opacity:0.45; z-index:0; pointer-events:none; animation:orbFloat 9s ease-in-out infinite;}
  .orb-1{width:520px; height:520px; background:var(--orange); top:-180px; left:-140px; animation-delay:0s;}
  .orb-2{width:460px; height:460px; background:var(--amber); bottom:-170px; right:-120px; opacity:0.35; animation-delay:-4s;}
  .orb-3{width:300px; height:300px; background:var(--orange-deep); top:40%; left:60%; opacity:0.2; animation-delay:-2s;}
  @keyframes orbFloat{
    0%,100%{ transform:translate(0,0) scale(1); }
    50%{ transform:translate(20px,-24px) scale(1.06); }
  }

  .spark{position:absolute; width:4px; height:4px; border-radius:50%; background:var(--amber); opacity:0; animation:sparkTwinkle 3.4s ease-in-out infinite;}
  @keyframes sparkTwinkle{ 0%,100%{opacity:0;} 50%{opacity:.8;} }

  .scene{
    position:relative;
    z-index:2;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .hero-content{
    position:relative;
    max-width:560px;
    padding:0 28px;
    transition:opacity .5s ease, transform .5s ease;
  }
  .hero-content.is-hidden{ opacity:0; transform:translateY(-16px) scale(0.96); pointer-events:none; }

  .kicker{font-family:var(--font-mono); font-size:12px; letter-spacing:.08em; color:var(--orange-deep); margin-bottom:14px;}
  h1{font-size:clamp(32px,6vw,48px); font-weight:800; letter-spacing:-0.02em; line-height:1.1; margin-bottom:16px;}
  h1 span{background:linear-gradient(135deg, var(--orange-deep), var(--orange), var(--amber)); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .tagline{font-size:16px; color:var(--text-dim); line-height:1.6; margin-bottom:34px;}

  .launch-btn{
    position:relative;
    display:inline-flex; align-items:center; gap:10px;
    font-family:inherit; font-size:16px; font-weight:700; color:#fff;
    background:linear-gradient(135deg, var(--orange-deep), var(--orange) 55%, var(--amber));
    border:none; padding:17px 32px; border-radius:100px; cursor:pointer;
    box-shadow:0 16px 36px rgba(255,122,47,0.4);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .launch-btn:hover{ transform:translateY(-2px); box-shadow:0 20px 44px rgba(255,122,47,0.48); }
  .launch-btn:active{ transform:translateY(0); }
  .launch-btn:disabled{ opacity:.85; cursor:default; }

  /* ---------- Lune + fusée réaliste en orbite avec drapeau ---------- */
  .moon-scene{
    position:relative;
    width:260px; height:260px;
    margin:0 auto 4px;
    transition:opacity .5s ease, transform .5s ease;
  }
  .moon-scene.is-launching{ animation:warpAway 1.5s ease-in forwards; }

  .moon{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:112px; height:112px; border-radius:50%;
    background:radial-gradient(circle at 32% 28%, #f4efe4, #c9c0ac 55%, #8f8571 92%);
    box-shadow:inset -18px -18px 34px rgba(0,0,0,0.38), 0 24px 48px rgba(25,20,13,0.28);
  }
  .crater{position:absolute; border-radius:50%; background:rgba(60,52,38,0.28); box-shadow:inset 1.5px 1.5px 3px rgba(0,0,0,0.3);}
  .crater-1{width:16px; height:16px; top:20%; left:28%;}
  .crater-2{width:10px; height:10px; top:54%; left:64%;}
  .crater-3{width:8px; height:8px; top:68%; left:24%;}
  .crater-4{width:6px; height:6px; top:33%; left:66%;}

  .orbit-pivot{
    position:absolute; top:50%; left:50%; width:1px; height:1px;
    animation:orbitSpin 9s linear infinite;
  }
  .rocket-orbit{
    position:absolute; top:0; left:0;
    transform:translate(-50%,-50%) translateX(122px) rotate(115deg);
  }
  .rocket-orbit .rocket-svg{
    display:block; width:52px; height:auto;
    filter:drop-shadow(0 8px 14px rgba(25,20,13,0.3));
  }
  .thruster-flame{ transform-origin:center top; animation:flameFlicker .5s ease-in-out infinite alternate; }
  .flag-pennant{ transform-origin:66px 26px; animation:flagFlutter 1.6s ease-in-out infinite; }

  @keyframes orbitSpin{ from{ transform:rotate(0deg); } to{ transform:rotate(360deg); } }
  @keyframes flameFlicker{ 0%{ transform:scaleY(.85); opacity:.85; } 100%{ transform:scaleY(1.12); opacity:1; } }
  @keyframes flagFlutter{ 0%,100%{ transform:skewY(0deg) scaleX(1); } 50%{ transform:skewY(-6deg) scaleX(.94); } }
  @keyframes warpAway{
    0%{ transform:scale(1); opacity:1; }
    55%{ transform:scale(1.18); opacity:1; }
    100%{ transform:scale(2.4); opacity:0; }
  }
  @keyframes stageShake{
    0%,100%{ transform:translateX(0); }
    25%{ transform:translateX(-3px); }
    50%{ transform:translateX(3px); }
    75%{ transform:translateX(-2px); }
  }

  .skip-link{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    font-family:var(--font-mono); font-size:11.5px; color:var(--text-dim);
    text-decoration:none; opacity:.7; z-index:3;
  }
  .skip-link:hover{ opacity:1; color:var(--orange-deep); }

  @media (max-width:480px){
    .moon-scene{ width:200px; height:200px; transform:scale(0.85); }
  }

  @media (prefers-reduced-motion:reduce){
    .orb, .spark, .orbit-pivot, .thruster-flame, .flag-pennant{ animation:none; }
    .moon-scene.is-launching{ animation-duration:.6s; }
  }
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
  <div class="spark" style="top:18%; left:22%; animation-delay:-0.5s;"></div>
  <div class="spark" style="top:30%; left:78%; animation-delay:-1.8s;"></div>
  <div class="spark" style="top:68%; left:14%; animation-delay:-2.6s;"></div>
  <div class="spark" style="top:72%; left:82%; animation-delay:-1.1s;"></div>

  <div class="scene">
    <div class="moon-scene" id="moon-scene">
      <div class="moon">
        <div class="crater crater-1"></div>
        <div class="crater crater-2"></div>
        <div class="crater crater-3"></div>
        <div class="crater crater-4"></div>
      </div>
      <div class="orbit-pivot">
        <div class="rocket-orbit">
          <svg class="rocket-svg" viewBox="0 0 90 110" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="bodyGrad" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0%" stop-color="#fdfbf7"/>
                <stop offset="50%" stop-color="#eeeae1"/>
                <stop offset="100%" stop-color="#b9b2a4"/>
              </linearGradient>
              <linearGradient id="noseGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#ffb547"/>
                <stop offset="100%" stop-color="#ff5a1f"/>
              </linearGradient>
              <linearGradient id="finGrad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#ff7a2f"/>
                <stop offset="100%" stop-color="#c73f12"/>
              </linearGradient>
              <radialGradient id="windowGrad" cx="35%" cy="30%" r="75%">
                <stop offset="0%" stop-color="#dff4ff"/>
                <stop offset="55%" stop-color="#6db3dd"/>
                <stop offset="100%" stop-color="#2c6a94"/>
              </radialGradient>
              <linearGradient id="flagGrad" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0%" stop-color="#ff7a2f"/>
                <stop offset="100%" stop-color="#ffb547"/>
              </linearGradient>
              <linearGradient id="flameGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#fff3c4"/>
                <stop offset="45%" stop-color="#ffb547"/>
                <stop offset="100%" stop-color="#ff5a1f"/>
              </linearGradient>
            </defs>

            <ellipse class="thruster-flame" cx="40" cy="100" rx="9" ry="16" fill="url(#flameGrad)"/>
            <ellipse cx="40" cy="96" rx="5" ry="9" fill="#fff7e0" opacity="0.85"/>

            <path d="M26,72 L6,96 L26,88 Z" fill="url(#finGrad)"/>
            <path d="M54,72 L74,96 L54,88 Z" fill="url(#finGrad)"/>

            <path d="M40,6 C54,22 57,52 51,78 L29,78 C23,52 26,22 40,6 Z" fill="url(#bodyGrad)" stroke="#a49c8d" stroke-width="0.8"/>
            <path d="M40,6 C45,13 48,20 48.5,27 L31.5,27 C32,20 35,13 40,6 Z" fill="url(#noseGrad)"/>

            <circle cx="40" cy="45" r="9.5" fill="url(#windowGrad)" stroke="#fff" stroke-width="2"/>
            <circle cx="36.5" cy="41.5" r="2.8" fill="#fff" opacity="0.8"/>

            <rect x="27" y="76" width="26" height="6" rx="2.5" fill="#dcd6c9"/>

            <line x1="51" y1="40" x2="66" y2="26" stroke="#8a8375" stroke-width="1.6"/>
            <path class="flag-pennant" d="M66,26 L86,31 L66,42 Z" fill="url(#flagGrad)"/>
            <rect x="69.5" y="29" width="7.5" height="7.5" rx="1.6" fill="#19140d"/>
            <rect x="71.6" y="31.1" width="3.3" height="3.3" rx="0.7" fill="url(#flagGrad)"/>
          </svg>
        </div>
      </div>
    </div>

    <div class="hero-content" id="hero-content">
      <div class="kicker">CARROUSEL STUDIO</div>
      <h1>Crée du contenu <span>en quelques secondes</span></h1>
      <p class="tagline">Carrousels LinkedIn, visuels et présentations générés automatiquement à partir de tes idées. Prêt à décoller ?</p>
      <button type="button" class="launch-btn" id="launch-btn" onclick="launchRocket()">
        Commencer maintenant
      </button>
    </div>
  </div>
</div>

<a class="skip-link" href="accueil.html">Passer l'animation →</a>

<script>
  function launchRocket(){
    const btn = document.getElementById('launch-btn');
    const hero = document.getElementById('hero-content');
    const stage = document.getElementById('stage');
    const moonScene = document.getElementById('moon-scene');

    if(btn.disabled) return;
    btn.disabled = true;

    hero.classList.add('is-hidden');
    stage.classList.add('is-shaking');
    moonScene.classList.add('is-launching');

    setTimeout(() => {
      window.location.href = 'accueil.html';
    }, 1500);
  }
</script>
</body>
</html>
